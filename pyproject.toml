[project]
name = "vla-rolling"
version = "0.1.0"
description = "ACE confidence learning on frozen LeRobot vision-language-action policies"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lerobot==0.6.2",
  "torch==2.11.0+cu128", "torchvision==0.26.0+cu128", "torchcodec==0.11.1+cu128",
  "transformers==5.5.4", "accelerate==1.14.0", "peft==0.20.0",
  "numpy==1.26.4", "scipy==1.17.1", "datasets==4.8.5", "pandas==2.3.3",
  "pyarrow==25.0.1", "av==15.1.0", "jsonlines==4.0.0", "num2words==0.5.14",
  "einops==0.8.2", "safetensors==0.8.0", "huggingface-hub==1.30.0",
  "tokenizers==0.22.2", "draccus==0.11.6", "pillow==12.3.0",
  "opencv-python-headless==4.11.0.86", "gymnasium==1.3.0",
  "setuptools==81.0.0", "packaging==25.0",
]

[project.optional-dependencies]
eval = [
  "hf-libero==0.1.4", "metaworld==3.1.1", "mujoco==3.3.0",
  "robosuite==1.4.0", "robomimic==0.3.0", "bddl==3.6.0",
  "imageio==2.34.2", "numba==0.61.2", "h5py==3.16.0",
  "opencv-python==4.11.0.86",
]
robotwin = [
  "sapien==3.0.0b1", "mplib==0.2.1", "toppra==0.6.10", "open3d==0.19.0",
  "trimesh==4.4.3", "warp-lang==1.3.1", "numpy-quaternion==2024.0.13",
  "yourdfpy==0.0.60", "transforms3d==0.4.2", "imageio==2.34.2",
  "opencv-python==4.11.0.86", "h5py==3.16.0", "zarr==3.1.5",
  "pybind11==3.1.0", "setuptools-scm==8.3.1", "wheel==0.48.0",
  "ninja==1.13.2", "iopath==0.1.10", "easydict==1.13", "scikit-image==0.26.0",
  "hydra-core==1.3.5", "omegaconf>=2.2,<2.4",
  "ipywidgets==8.1.9",
]
wandb = ["wandb>=0.24,<0.28"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
default-groups = []
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# The root project owns dependency resolution, including simulator legacy pins.
override-dependencies = ["robomimic==0.3.0", "bddl==3.6.0", "metaworld==3.1.1"]
# Preserve the NumPy 1.26-compatible versions used in the training environment.
constraint-dependencies = [
  "contourpy==1.3.3", "tifffile==2026.3.3", "numcodecs==0.16.5",
  "matplotlib==3.11.1", "scikit-learn==1.9.0",
]

[tool.uv.sources]
lerobot = { path = "src/lerobot", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchcodec = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# Use a fixed public mirror, independently of this server's /etc/uv config.
[[tool.uv.index]]
name = "pypi-mirror"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
default = true
